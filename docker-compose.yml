services:
  postgres:
    image: postgres:16-alpine
    container_name: crisol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crisol
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - crisol-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d crisol']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crisol-postgres-data:
